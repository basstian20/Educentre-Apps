<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 — EduCentre: 5 Arah (prototipe klik)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Nunito:wght@500;700;800&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e9e9ec;color:#111;}
  #switcher{position:sticky;top:0;z-index:100;display:flex;gap:0;background:#111;padding:10px 12px;overflow-x:auto;align-items:center;}
  #switcher a.back{color:#888;font-size:12px;margin-right:14px;text-decoration:none;white-space:nowrap;}
  #switcher button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:8px;margin-right:8px;background:#2a2a2a;color:#ccc;cursor:pointer;white-space:nowrap;}
  #switcher button.active{background:#fff;color:#111;}
  #switcher .num{opacity:.55;margin-right:6px;font-weight:400;}
  #switcher .sp{flex:1;min-width:10px}
  #switcher button.reset{background:transparent;border:1px solid #444;color:#aaa;margin-right:0}
  .stage{display:none;}
  .stage.active{display:block;}
  .views{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap;align-items:center}
  .views button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border:1px solid #c9c9ce;border-radius:20px;background:#fff;color:#444;cursor:pointer;}
  .views button.active{background:#111;color:#fff;border-color:#111;}
  .views .hint{font-size:12px;color:#777;margin-left:6px}
  .view{display:none;padding:14px 16px 0;}
  .view.active{display:block;}
  .fit{position:relative;margin:0 auto;}
  .fit>.mk{position:absolute;left:0;top:0;transform-origin:0 0;}
  .direction-note{font-size:12.5px;line-height:1.55;margin:16px;padding:14px 16px;border-radius:10px;background:#fff;border:1px dashed #b9b9c0;color:#333;}
  .direction-note b{color:#111}
  .mk *{box-sizing:border-box}
</style>
<script>var V=Date.now();['base-v1','d1','d2','d3','d4','d5','base','d1x','d2x','d3x','d4x','d5x'].forEach(function(f){document.write('<link rel="stylesheet" href="v2/'+f+'.css?v='+V+'">')});</script>
</head>
<body>
<div id="switcher"><a class="back" href="../index.html">&larr; semua riwayat</a></div>
<div id="stages"></div>
<script>['core','d1','d2','d3','d4','d5'].forEach(function(f){document.write('<script src="v2/'+f+'.js?v='+V+'"><\/script>')});</script>
<script>
var DIRS=[
 {id:'d1',name:'Buku Induk',note:'Metafora buku induk dan buku absen sekolah: halaman bergaris, stempel, tab pembatas. Navigasi lewat tab di tepi kanan, bukan sidebar.',
  hint:'Coba: (Educator) ketuk bulatan absen lalu "Simpan &amp; paraf" → (Admin) tab Absensi. (Orang tua) "Lapor sudah bayar" → (Admin) ketuk stempel MENUNGGU untuk konfirmasi. Ketuk stempel BELUM untuk catat bayar.'},
 {id:'d2',name:'Linimasa Hari Ini',note:'Navigasi utama adalah waktu: ruang × jam, tindakan menempel pada sesi.',
  hint:'Coba: (Admin) ketuk blok sesi di linimasa. (Educator) ketuk sesi yang sedang berjalan lalu isi absensi. (Orang tua) ketuk "SPP jatuh tempo".'},
 {id:'d3',name:'Ruang Obrolan',note:'Pengganti grup WhatsApp: ruang per kelas, umpan kartu tindakan, tombol cepat di kotak tulis.',
  hint:'Coba: (Admin) pilih ruang kelas lalu tekan "Catat bayar" di kartu tagihan. (Educator) chip Absensi / Nilai. (Orang tua) tekan "Lapor sudah bayar".'},
 {id:'d4',name:'Kartu Siswa 360',note:'Entitas utamanya siswa: kartu dengan cincin kehadiran, filter perlu perhatian, panel profil.',
  hint:'Coba: (Admin) filter "Perlu perhatian", ketuk kartu → panel profil → Catat bayar. (Educator) ketuk kartu siswa untuk ganti status. (Orang tua) ketuk kartu tagihan.'},
 {id:'d5',name:'Meja Kasir',note:'Berpusat pada uang: layar LED, pita transaksi seperti struk, nota belum lunas.',
  hint:'Coba: (Admin) ketuk nota belum lunas atau "Catat bayar" → lihat LED dan pita bertambah. "Cetak struk", "Tutup kas". (Orang tua) "Konfirmasi sudah bayar".'}];
var ROLES=[['admin','Admin · desktop',1000,620],['educator','Educator · HP',270,560],['parent','Orang tua · HP',270,560]];
var sw=document.getElementById('switcher'),st=document.getElementById('stages'),mounted={};
DIRS.forEach(function(d,i){
  var b=document.createElement('button');b.innerHTML='<span class="num">'+(i+1)+'</span>'+d.name;b.onclick=function(){show(i+1)};sw.appendChild(b);
  var html='<div class="stage" id="s'+(i+1)+'"><div class="views">'+ROLES.map(function(r,j){return '<button class="'+(j?'':'active')+'" data-v="'+j+'">'+r[1]+'</button>'}).join('')+'<span class="hint">'+d.hint+'</span></div>'+
   ROLES.map(function(r,j){return '<div class="view'+(j?'':' active')+'" data-j="'+j+'"><div class="fit" data-w="'+r[2]+'" data-h="'+r[3]+'"><div class="mk '+d.id+'" id="c-'+d.id+'-'+r[0]+'"></div></div></div>'}).join('')+
   '<div class="direction-note"><b>Arah '+(i+1)+' — '+d.name+'.</b> '+d.note+' Data satu sumber: tindakan di satu peran langsung terlihat di peran lain.</div></div>';
  st.insertAdjacentHTML('beforeend',html);
  ROLES.forEach(function(r){var el=document.getElementById('c-'+d.id+'-'+r[0]);mounted[d.id+r[0]]=EDU.mount(el,d.id+'-'+r[0])});
});
var rs=document.createElement('span');rs.className='sp';sw.appendChild(rs);
var rb=document.createElement('button');rb.className='reset';rb.textContent='Reset data demo';rb.onclick=function(){EDU.reset()};sw.appendChild(rb);
st.addEventListener('click',function(e){var b=e.target.closest('.views button');if(!b)return;var s=b.closest('.stage');
  s.querySelectorAll('.views button').forEach(function(x){x.classList.toggle('active',x===b)});
  s.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.dataset.j===b.dataset.v)});fit();EDU.redraw()});
function show(n){
  document.querySelectorAll('.stage').forEach(function(s){s.classList.remove('active')});
  document.getElementById('s'+n).classList.add('active');
  document.querySelectorAll('#switcher button:not(.reset)').forEach(function(b,i){b.classList.toggle('active',i===n-1)});
  try{history.replaceState(null,'','#'+n)}catch(e){}
  fit();EDU.redraw();
}
function fit(){
  var s=document.querySelector('.stage.active');if(!s)return;
  var f=s.querySelector('.view.active .fit');if(!f)return;
  var w=+f.dataset.w,h=+f.dataset.h,mobile=w<400,availW=innerWidth-32,availH=innerHeight-170;
  var k=mobile?Math.min(availH/h,1.3):Math.min(availW/w,1.6);
  f.style.width=(w*k)+'px';f.style.height=(h*k)+'px';f.firstElementChild.style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
var n=parseInt((location.hash||'#1').slice(1),10);show(n>=1&&n<=DIRS.length?n:1);
</script>
</body>
</html>
