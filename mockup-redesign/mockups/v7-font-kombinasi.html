<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V7 — EduCentre: Clay Soft Ocean Blue, 4 kombinasi font</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Fredoka:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e9e9ec;color:#111;}
  #switcher{position:sticky;top:0;z-index:100;display:flex;gap:0;background:#111;padding:10px 12px;overflow-x:auto;align-items:center;}
  #switcher a.back{color:#888;font-size:12px;margin-right:14px;text-decoration:none;white-space:nowrap;}
  #switcher button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:8px;margin-right:8px;background:#2a2a2a;color:#ccc;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
  #switcher button.active{background:#fff;color:#111;}
  #switcher .num{opacity:.55;font-weight:400;}
  #switcher .aa{font-size:17px;line-height:1;opacity:.9}
  #switcher .sp{flex:1;min-width:10px}
  #switcher button.reset{background:transparent;border:1px solid #444;color:#aaa;margin-right:0}
  .stage{display:none;}
  .stage.active{display:block;}
  .bar2{display:flex;gap:18px;padding:12px 16px 0;flex-wrap:wrap;align-items:center}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grp .k{font-size:11.5px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
  .bar2 button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border:1px solid #c9c9ce;border-radius:20px;background:#fff;color:#444;cursor:pointer;}
  .bar2 button.active{background:#111;color:#fff;border-color:#111;}
  .hint{font-size:12px;color:#666;padding:8px 16px 0;max-width:1100px}
  .view{display:none;padding:12px 16px 0;}
  .view.active{display:block;}
  .fit{position:relative;margin:0 auto;}
  .fit>.mk{position:absolute;left:0;top:0;transform-origin:0 0;}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 0}
  .cmp .cell{min-width:0}
  .cmp h3{margin:0 0 6px;font-size:13px}
  .info{margin:16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
  @media (max-width:900px){.info{grid-template-columns:1fr}}
  .note{font-size:12.5px;line-height:1.55;padding:14px 16px;border-radius:10px;background:#fff;border:1px dashed #b9b9c0;color:#333}
  .note b{color:#111}
  .note dl{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;margin:10px 0 0}
  .note dt{color:#777;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}.note dd{margin:0}
  /* spesimen */
  .spec{background:var(--surface);color:var(--ink);font-family:var(--font);border-radius:22px;padding:18px 22px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.5}
  .spec .k{font:700 11px sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}.spec .k:first-child{margin-top:0}
  .spec .h1{font:var(--hw) 30px/1.15 var(--fh);letter-spacing:-.01em}
  .spec .h3{font:var(--hw) 17px/1.2 var(--fh)}
  .spec .num{font:var(--hw) 26px/1.2 var(--fnum);font-variant-numeric:tabular-nums lining-nums;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
  .spec .num small{font:500 12px var(--font);color:var(--mut)}
  .spec p{margin:0}
  .spec .ui{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spec .ui span{font:var(--bw) 12px var(--font);border-radius:99px;padding:3px 10px;background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:color-mix(in srgb,var(--ok) 70%,var(--ink))}
  .spec .ui span.w{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:color-mix(in srgb,var(--warn) 60%,var(--ink))}
  .spec .ui span.b{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:color-mix(in srgb,var(--bad) 75%,var(--ink))}
  .spec .ui i{font:var(--bw) 12.5px var(--font);font-style:normal;background:linear-gradient(180deg,var(--pl),var(--pri));color:#fff;border-radius:99px;padding:6px 14px;box-shadow:0 4px 0 var(--pd)}
  .spec .abc{font:500 15px/1.5 var(--font);word-break:break-all}
  .spec .tiny{font:400 12px/1.4 var(--font);color:var(--mut)}
</style>
<script>var V=Date.now();['base','c','../v4/base4','../v7/clay7','../v6/palettes','../v7/fonts7'].forEach(function(f){document.write('<link rel="stylesheet" href="'+(f.indexOf('../')===0?f.slice(3):'v3/'+f)+'.css?v='+V+'">')});</script>
</head>
<body>
<div id="switcher"><a class="back" href="../index.html">&larr; semua riwayat</a></div>
<div id="stages"></div>
<script>['v3/data','v3/i18n','v3/app','v3/pages1','v3/pages2','v4/pages3','v4/motion','v5/pages5','v5/motion5'].forEach(function(f){document.write('<script src="'+f+'.js?v='+V+'"><\/script>')});</script>
<script>
var FONTS=[
 {id:'a',name:'A · Bulat Empuk',fam:'"Fredoka"',pair:'Fredoka + Nunito',judul:'Fredoka (600)',isi:'Nunito (400–800)',angka:'Fredoka',
  why:'Huruf yang membulat selaras dengan bentuk tanah liat yang menggembung dan biru yang ramah. Terasa hangat dan bermain, nyaman bagi anak-anak hingga orang tua. Nunito untuk isi tetap terbaca baik pada ukuran 12 px.',
  note:'Paling ceria. Fredoka hanya sampai bobot 700 sehingga angka KPI terlihat "empuk", bukan tegas.'},
 {id:'b',name:'B · Modern Jakarta',fam:'"Plus Jakarta Sans"',pair:'Plus Jakarta Sans (satu keluarga)',judul:'Plus Jakarta Sans (800)',isi:'Plus Jakarta Sans (400–700)',angka:'Plus Jakarta Sans, angka tabular',
  why:'Geometris, bersih, dan berakar dari desain di Indonesia. Netral di samping bentuk 3D sehingga warna dan kartu yang menonjol. Angka sejajar rapi untuk tagihan dan nilai. Satu keluarga saja berarti pemuatan paling ringan.',
  note:'Paling netral dan efisien. Kurang berkarakter dibanding A atau D, tetapi paling aman untuk data padat.'},
 {id:'c',name:'C · Mudah Dibaca',fam:'"Lexend"',pair:'Lexend (satu keluarga)',judul:'Lexend (600)',isi:'Lexend (400–600)',angka:'Lexend, angka tabular',
  why:'Dirancang untuk keterbacaan: huruf lapang dan jelas dibedakan, tenang seperti biru laut. Cocok untuk siswa SD, remaja, dan orang tua sekaligus, termasuk saat dibaca cepat di HP.',
  note:'Hurufnya lebar, jadi teks lebih panjang dan ukuran dasar diturunkan ke 13 px. Kesan paling "edukatif".'},
 {id:'d',name:'D · Serif Hangat',fam:'"Fraunces"',pair:'Fraunces + Figtree',judul:'Fraunces (600)',isi:'Figtree (400–700)',angka:'Fraunces',
  why:'Judul serif yang lembut bersama biru memberi kesan lembaga tepercaya namun tetap hangat. Angka berserif tampil elegan dan berkelas. Figtree untuk isi bersih dan netral.',
  note:'Paling berkarakter dan "editorial", tetapi paling jauh dari kesan teknologi. Pada tabel sangat padat terasa kurang efisien.'}];
var ROLES=[['login','Layar masuk'],['admin','Admin'],['educator','Educator'],['student','Siswa'],['parent','Orang tua']];
var sw=document.getElementById('switcher'),st=document.getElementById('stages'),inst={},cmp={};
function bar(extraDev){return '<div class="bar2"><div class="grp"><span class="k">Masuk sebagai</span>'+ROLES.map(function(r,j){return '<button type="button" data-role="'+r[0]+'" class="'+(j===0?'active':'')+'">'+r[1]+'</button>'}).join('')+'</div>'+(extraDev?'<div class="grp"><span class="k">Perangkat</span><button type="button" data-dev="d" class="active">Desktop</button><button type="button" data-dev="m">HP</button></div>':'')+'<div class="grp"><span class="k">Mode</span><button type="button" data-mode="light" class="active">Terang</button><button type="button" data-mode="dark">Gelap</button></div></div>'}
function spec(f){return '<div class="th-c5 spec" data-pal="d" data-font="'+f.id+'" data-mode="light"><div class="k">Judul halaman</div><div class="h1">Selamat sore, Sari</div><div class="k">Judul kartu</div><div class="h3">Jadwal hari ini · Kehadiran per pekan</div><div class="k">Angka: KPI, tagihan, nilai, jam</div><div class="num"><span>Rp 1.982.500</span><span>91%</span><span>88,5</span><span>15.30–17.00</span></div><div class="k">Isi teks (13,5 px)</div><p>Ulangan 3 Matematika sudah dinilai dan diterbitkan. Nilai Aiman 88, di atas batas lulus 60. Mohon membawa buku latihan pecahan pada pertemuan berikutnya, hari Rabu pukul 15.30.</p><div class="k">Label kecil (12 px) dan tombol</div><div class="ui"><span>Hadir</span><span class="w">Belum bayar</span><span class="b">Terlambat</span><i>Catat pembayaran</i></div><div class="k">Abjad dan angka</div><div class="abc">AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz 0123456789</div><div class="tiny">Teks 12 px: Dikembangkan oleh NobleDev · Bimbel Cerdas, Jl. Melati No. 12</div></div>'}
FONTS.forEach(function(f,i){
  var b=document.createElement('button');b.innerHTML='<span class="num">'+(i+1)+'</span><span class="aa" style="font-family:'+f.fam+',sans-serif;font-weight:600">Aa</span>'+f.name.split(' · ')[1];b.onclick=function(){show(i+1)};sw.appendChild(b);
  st.insertAdjacentHTML('beforeend','<div class="stage" id="s'+(i+1)+'">'+bar(true)+
   '<div class="hint">Palet tetap Ocean Blue. Coba ganti peran (Admin, Educator, Siswa, Orang tua) dan lihat judul, angka, tabel, dan tombol dalam font ini. Spesimen di bawah memakai teks proyek yang sebenarnya.</div>'+
   '<div class="view active" data-dev="d"><div class="fit" data-w="1200" data-h="780"><div id="v-'+f.id+'-d"></div></div></div><div class="view" data-dev="m"><div class="fit" data-w="372" data-h="756"><div id="v-'+f.id+'-m"></div></div></div>'+
   '<div class="info"><div class="note"><b>'+f.name+' · '+f.pair+'</b><dl><dt>Judul</dt><dd>'+f.judul+'</dd><dt>Isi</dt><dd>'+f.isi+'</dd><dt>Angka</dt><dd>'+f.angka+'</dd><dt>Mengapa cocok</dt><dd>'+f.why+'</dd><dt>Catatan</dt><dd>'+f.note+'</dd><dt>Lisensi</dt><dd>Google Fonts (SIL Open Font License), gratis untuk dipakai dan dipasang sendiri.</dd></dl></div>'+spec(f)+'</div></div>');
  var d=document.getElementById('v-'+f.id+'-d'),m=document.getElementById('v-'+f.id+'-m');
  [d,m].forEach(function(x){x.setAttribute('data-pal','d');x.setAttribute('data-font',f.id)});
  inst[f.id]={d:EduApp.create(d,{theme:'c',cls:'th-c5',mob:false}),m:EduApp.create(m,{theme:'c',cls:'th-c5',mob:true})};
  [d,m].forEach(function(x){x.setAttribute('data-pal','d');x.setAttribute('data-font',f.id)});
});
var cb=document.createElement('button');cb.innerHTML='<span class="num">5</span>Bandingkan 4';cb.onclick=function(){show(5)};sw.appendChild(cb);
st.insertAdjacentHTML('beforeend','<div class="stage" id="s5">'+bar(false)+'<div class="hint">Keempat font pada layar yang sama dengan palet Ocean Blue. Ganti peran atau mode untuk membandingkan.</div><div class="view active"><div class="cmp">'+FONTS.map(function(f){return '<div class="cell"><h3>'+f.name+' · '+f.pair+'</h3><div class="fit" data-w="1200" data-h="780"><div id="v-cmp-'+f.id+'"></div></div></div>'}).join('')+'</div></div></div>');
FONTS.forEach(function(f){var e=document.getElementById('v-cmp-'+f.id);e.setAttribute('data-pal','d');e.setAttribute('data-font',f.id);cmp[f.id]=EduApp.create(e,{theme:'c',cls:'th-c5',mob:false});e.setAttribute('data-pal','d');e.setAttribute('data-font',f.id)});
var rs=document.createElement('span');rs.className='sp';sw.appendChild(rs);
var rb=document.createElement('button');rb.className='reset';rb.textContent='Reset data demo';rb.onclick=function(){EDUDATA.reset();FONTS.forEach(function(f){inst[f.id].d.showLogin();inst[f.id].m.showLogin();cmp[f.id].showLogin()});document.querySelectorAll('.stage .bar2 [data-role]').forEach(function(x){x.classList.toggle('active',x.dataset.role==='login')})};sw.appendChild(rb);
function stageInst(sid){return sid===5?FONTS.map(function(f){return cmp[f.id]}):[inst[FONTS[sid-1].id].d,inst[FONTS[sid-1].id].m]}
st.addEventListener('click',function(e){
  var b=e.target.closest('.bar2 button');if(!b)return;var s=b.closest('.stage'),sid=+s.id.slice(1),list=stageInst(sid);
  if(b.dataset.role){s.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('active',x===b)});list.forEach(function(a){if(b.dataset.role==='login')a.showLogin();else a.loginAs(b.dataset.role)})}
  if(b.dataset.mode){s.querySelectorAll('[data-mode]').forEach(function(x){x.classList.toggle('active',x===b)});list.forEach(function(a){a.setMode(b.dataset.mode)});s.querySelectorAll('.spec').forEach(function(x){x.setAttribute('data-mode',b.dataset.mode)})}
  if(b.dataset.dev){s.querySelectorAll('[data-dev]').forEach(function(x){if(x.tagName==='BUTTON')x.classList.toggle('active',x===b);else x.classList.toggle('active',x.dataset.dev===b.dataset.dev)});fit()}
});
function show(n){
  document.querySelectorAll('.stage').forEach(function(s){s.classList.remove('active')});
  document.getElementById('s'+n).classList.add('active');
  document.querySelectorAll('#switcher button:not(.reset)').forEach(function(b,i){b.classList.toggle('active',i===n-1)});
  try{history.replaceState(null,'','#'+n)}catch(e){}
  fit();
}
function fit(){
  var s=document.querySelector('.stage.active');if(!s)return;
  s.querySelectorAll('.view.active .fit').forEach(function(f){
    var w=+f.dataset.w,h=+f.dataset.h,mobile=w<500,par=f.parentElement,cs=getComputedStyle(par),pw=par.clientWidth-(parseFloat(cs.paddingLeft)||0)*2,availH=innerHeight-190;
    var k=mobile?Math.min(availH/h,1.1):Math.min(pw/w,1.3);
    f.style.width=(w*k)+'px';f.style.height=(h*k)+'px';f.firstElementChild.style.transform='scale('+k+')';
  });
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
var n=parseInt((location.hash||'#1').slice(1),10);show(n>=1&&n<=5?n:1);
</script>
</body>
</html>
