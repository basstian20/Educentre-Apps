<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3 — EduCentre: 3 Arah, semua fitur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e9e9ec;color:#111;}
  #switcher{position:sticky;top:0;z-index:100;display:flex;gap:0;background:#111;padding:10px 12px;overflow-x:auto;align-items:center;}
  #switcher a.back{color:#888;font-size:12px;margin-right:14px;text-decoration:none;white-space:nowrap;}
  #switcher button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:8px;margin-right:8px;background:#2a2a2a;color:#ccc;cursor:pointer;white-space:nowrap;}
  #switcher button.active{background:#fff;color:#111;}
  #switcher .num{opacity:.55;margin-right:6px;font-weight:400;}
  #switcher .sp{flex:1;min-width:10px}
  #switcher button.reset{background:transparent;border:1px solid #444;color:#aaa;margin-right:0}
  .stage{display:none;}
  .stage.active{display:block;}
  .bar2{display:flex;gap:18px;padding:12px 16px 0;flex-wrap:wrap;align-items:center}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grp .k{font-size:11.5px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
  .bar2 button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border:1px solid #c9c9ce;border-radius:20px;background:#fff;color:#444;cursor:pointer;}
  .bar2 button.active{background:#111;color:#fff;border-color:#111;}
  .hint{font-size:12px;color:#666;padding:8px 16px 0;max-width:1100px}
  .view{display:none;padding:12px 16px 0;}
  .view.active{display:block;}
  .fit{position:relative;margin:0 auto;}
  .fit>.mk{position:absolute;left:0;top:0;transform-origin:0 0;}
  .direction-note{font-size:12.5px;line-height:1.55;margin:16px;padding:14px 16px;border-radius:10px;background:#fff;border:1px dashed #b9b9c0;color:#333;}
  .direction-note b{color:#111}
</style>
<script>var V=Date.now();['base','a','b','c'].forEach(function(f){document.write('<link rel="stylesheet" href="v3/'+f+'.css?v='+V+'">')});</script>
</head>
<body>
<div id="switcher"><a class="back" href="../index.html">&larr; semua riwayat</a></div>
<div id="stages"></div>
<script>['data','i18n','app','pages1','pages2'].forEach(function(f){document.write('<script src="v3/'+f+'.js?v='+V+'"><\/script>')});</script>
<script>
var DIRS=[
 {id:'a',name:'Tenang & Terang',note:'Teal bersih, ruang lega, kartu dan ikon jelas. Sidebar terang, angka KPI besar dengan ikon, tombol dengan bayangan lembut. Cocok untuk semua usia karena netral dan ramah.'},
 {id:'b',name:'Hangat & Tertata',note:'Kertas hangat, hijau tua, judul dan angka serif ala majalah. Navigasi pil, KPI tanpa kotak dengan garis atas, nuansa personal khas bimbel. Paling berkarakter, tetap struktur sidebar + dasbor + modul.'},
 {id:'c',name:'Tegas & Efisien',note:'Sidebar gelap, aksen indigo, padat dan mudah dipindai: jejak halaman, KPI bergaris warna, tabel rapat dengan baris selang-seling. Cocok untuk admin yang bekerja seharian dan data banyak.'}];
var ROLES=[['login','Layar masuk'],['admin','Admin'],['educator','Educator'],['student','Siswa'],['parent','Orang tua']];
var sw=document.getElementById('switcher'),st=document.getElementById('stages'),inst={};
DIRS.forEach(function(d,i){
  var b=document.createElement('button');b.innerHTML='<span class="num">'+(i+1)+'</span>'+d.name;b.onclick=function(){show(i+1)};sw.appendChild(b);
  st.insertAdjacentHTML('beforeend','<div class="stage" id="s'+(i+1)+'"><div class="bar2"><div class="grp"><span class="k">Masuk sebagai</span>'+ROLES.map(function(r,j){return '<button type="button" data-role="'+r[0]+'" class="'+(j===0?'active':'')+'">'+r[1]+'</button>'}).join('')+'</div><div class="grp"><span class="k">Perangkat</span><button type="button" data-dev="d" class="active">Desktop</button><button type="button" data-dev="m">HP</button></div></div>'+
   '<div class="hint">Coba: masuk sebagai Admin, tambah siswa atau catat pembayaran. Lalu pindah ke Educator untuk isi absensi dan nilai, dan lihat hasilnya di Siswa atau Orang tua. Semua tombol, tabel (cari, urut, halaman), formulir, dan menu bisa diklik.</div>'+
   '<div class="view active" data-dev="d"><div class="fit" data-w="1200" data-h="780"><div id="v-'+d.id+'-d"></div></div></div><div class="view" data-dev="m"><div class="fit" data-w="372" data-h="756"><div id="v-'+d.id+'-m"></div></div></div>'+
   '<div class="direction-note"><b>Arah '+String.fromCharCode(64+i+1)+' — '+d.name+'.</b> '+d.note+' Semua fitur aplikasi sekarang tercakup untuk empat peran; struktur tetap familiar (sidebar, dasbor, halaman per modul). Bahasa bisa diganti ID/EN dari bilah atas, dan mode gelap dari tombol bulan.</div></div>');
  inst[d.id]={d:EduApp.create(document.getElementById('v-'+d.id+'-d'),{theme:d.id,mob:false}),m:EduApp.create(document.getElementById('v-'+d.id+'-m'),{theme:d.id,mob:true})};
});
var rs=document.createElement('span');rs.className='sp';sw.appendChild(rs);
var rb=document.createElement('button');rb.className='reset';rb.textContent='Reset data demo';rb.onclick=function(){EDUDATA.reset();DIRS.forEach(function(d){inst[d.id].d.showLogin();inst[d.id].m.showLogin()});document.querySelectorAll('.stage .bar2 [data-role]').forEach(function(x){x.classList.toggle('active',x.dataset.role==='login')})};sw.appendChild(rb);
st.addEventListener('click',function(e){
  var b=e.target.closest('.bar2 button');if(!b)return;var s=b.closest('.stage'),id=DIRS[+s.id.slice(1)-1].id;
  if(b.dataset.role){s.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('active',x===b)});['d','m'].forEach(function(k){if(b.dataset.role==='login')inst[id][k].showLogin();else inst[id][k].loginAs(b.dataset.role)})}
  if(b.dataset.dev){s.querySelectorAll('[data-dev]').forEach(function(x){if(x.tagName==='BUTTON')x.classList.toggle('active',x===b);else x.classList.toggle('active',x.dataset.dev===b.dataset.dev)});fit()}
});
function show(n){
  document.querySelectorAll('.stage').forEach(function(s){s.classList.remove('active')});
  document.getElementById('s'+n).classList.add('active');
  document.querySelectorAll('#switcher button:not(.reset)').forEach(function(b,i){b.classList.toggle('active',i===n-1)});
  try{history.replaceState(null,'','#'+n)}catch(e){}
  fit();
}
function fit(){
  var s=document.querySelector('.stage.active');if(!s)return;
  var f=s.querySelector('.view.active .fit');if(!f)return;
  var w=+f.dataset.w,h=+f.dataset.h,mobile=w<500,availW=innerWidth-32,availH=innerHeight-180;
  var k=mobile?Math.min(availH/h,1.1):Math.min(availW/w,1.3);
  f.style.width=(w*k)+'px';f.style.height=(h*k)+'px';f.firstElementChild.style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
var n=parseInt((location.hash||'#1').slice(1),10);show(n>=1&&n<=DIRS.length?n:1);
</script>
</body>
</html>
