<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V6 — EduCentre: Clay Soft, 4 palet warna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e9e9ec;color:#111;}
  #switcher{position:sticky;top:0;z-index:100;display:flex;gap:0;background:#111;padding:10px 12px;overflow-x:auto;align-items:center;}
  #switcher a.back{color:#888;font-size:12px;margin-right:14px;text-decoration:none;white-space:nowrap;}
  #switcher button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:8px;margin-right:8px;background:#2a2a2a;color:#ccc;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
  #switcher button.active{background:#fff;color:#111;}
  #switcher .num{opacity:.55;font-weight:400;}
  #switcher .sw{display:inline-flex}#switcher .sw i{width:12px;height:12px;border-radius:50%;margin-left:-3px;border:1.5px solid #2a2a2a;display:block}
  #switcher button.active .sw i{border-color:#fff}
  #switcher .sp{flex:1;min-width:10px}
  #switcher button.reset{background:transparent;border:1px solid #444;color:#aaa;margin-right:0}
  .stage{display:none;}
  .stage.active{display:block;}
  .bar2{display:flex;gap:18px;padding:12px 16px 0;flex-wrap:wrap;align-items:center}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grp .k{font-size:11.5px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
  .bar2 button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border:1px solid #c9c9ce;border-radius:20px;background:#fff;color:#444;cursor:pointer;}
  .bar2 button.active{background:#111;color:#fff;border-color:#111;}
  .hint{font-size:12px;color:#666;padding:8px 16px 0;max-width:1100px}
  .hint kbd{font:600 11px sans-serif;background:#fff;border:1px solid #c9c9ce;border-bottom-width:2px;border-radius:5px;padding:1px 6px}
  .view{display:none;padding:12px 16px 0;}
  .view.active{display:block;}
  .fit{position:relative;margin:0 auto;}
  .fit>.mk{position:absolute;left:0;top:0;transform-origin:0 0;}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 0}
  .cmp .cell{min-width:0}
  .cmp h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
  .cmp h3 .sw{display:inline-flex}.cmp h3 .sw i{width:14px;height:14px;border-radius:50%;margin-left:-3px;border:2px solid #fff;display:block}
  .direction-note{font-size:12.5px;line-height:1.55;margin:16px;padding:14px 16px;border-radius:10px;background:#fff;border:1px dashed #b9b9c0;color:#333;}
  .direction-note b{color:#111}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .chips .c{display:flex;align-items:center;gap:6px;font-size:12px;color:#444;background:#f3f3f6;border:1px solid #e0e0e6;border-radius:99px;padding:3px 10px 3px 4px}
  .chips .c i{width:18px;height:18px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
</style>
<script>var V=Date.now();['base','c','../v4/base4','../v6/clay6','../v6/palettes'].forEach(function(f){document.write('<link rel="stylesheet" href="'+(f.indexOf('../')===0?f.slice(3):'v3/'+f)+'.css?v='+V+'">')});</script>
</head>
<body>
<div id="switcher"><a class="back" href="../index.html">&larr; semua riwayat</a></div>
<div id="stages"></div>
<script>['v3/data','v3/i18n','v3/app','v3/pages1','v3/pages2','v4/pages3','v4/motion','v5/pages5','v5/motion5'].forEach(function(f){document.write('<script src="'+f+'.js?v='+V+'"><\/script>')});</script>
<script>
var PALS=[
 {id:'a',name:'A · Lavender & Peach',sw:['#7c6cf0','#a093fb','#ff9b7a','#ffd166','#27b98a'],mood:'Palet asli Clay Soft: ungu lembut dengan aksen peach dan kuning. Ramah, bermain, tetap profesional. Cocok bila ingin kesan kreatif dan modern.',
  cols:[['Utama','#7c6cf0'],['Terang','#a093fb'],['Latar','#f0ecfb'],['Teks','#2a2552'],['Aksen','#ff9b7a']]},
 {id:'b',name:'B · Mint & Sky',sw:['#10a897','#4fd6c4','#33a8ee','#ffe066','#6fbf2a'],mood:'Teal-mint dengan langit biru dan kuning lemon. Terasa segar, bersih, dan menenangkan; baik untuk kesan pendidikan, kesehatan, dan pertumbuhan.',
  cols:[['Utama','#10a897'],['Terang','#4fd6c4'],['Latar','#e9f7f4'],['Teks','#0f3b3a'],['Aksen','#33a8ee']]},
 {id:'c',name:'C · Sunset Coral',sw:['#f26a47','#ff9b7a','#ec4899','#f0a020','#2fb98d'],mood:'Koral hangat dengan magenta dan emas. Energik dan bersahabat, paling "hidup". Cocok untuk bimbel anak yang ingin kesan ceria dan akrab.',
  cols:[['Utama','#f26a47'],['Terang','#ff9b7a'],['Latar','#fdefe7'],['Teks','#4a2a22'],['Aksen','#ec4899']]},
 {id:'d',name:'D · Ocean Blue',sw:['#3f6df2','#7aa2ff','#12b6d4','#f1a31c','#ee4d6a'],mood:'Biru laut dengan cyan dan kuning. Terpercaya, tenang, dan kredibel; paling aman bagi pemilik bimbel yang menginginkan kesan institusi tanpa kehilangan kelembutan.',
  cols:[['Utama','#3f6df2'],['Terang','#7aa2ff'],['Latar','#e9f0fd'],['Teks','#14264f'],['Aksen','#12b6d4']]}];
var ROLES=[['login','Layar masuk'],['admin','Admin'],['educator','Educator'],['student','Siswa'],['parent','Orang tua']];
var sw=document.getElementById('switcher'),st=document.getElementById('stages'),inst={},cmp={};
function dots(p){return '<span class="sw">'+p.sw.map(function(c){return '<i style="background:'+c+'"></i>'}).join('')+'</span>'}
function bar(extraDev){return '<div class="bar2"><div class="grp"><span class="k">Masuk sebagai</span>'+ROLES.map(function(r,j){return '<button type="button" data-role="'+r[0]+'" class="'+(j===0?'active':'')+'">'+r[1]+'</button>'}).join('')+'</div>'+(extraDev?'<div class="grp"><span class="k">Perangkat</span><button type="button" data-dev="d" class="active">Desktop</button><button type="button" data-dev="m">HP</button></div>':'')+'<div class="grp"><span class="k">Mode</span><button type="button" data-mode="light" class="active">Terang</button><button type="button" data-mode="dark">Gelap</button></div><div class="grp"><span class="k">Gerak</span><button type="button" data-motion="on" class="active">Penuh</button><button type="button" data-motion="off">Hemat</button></div></div>'}
PALS.forEach(function(p,i){
  var b=document.createElement('button');b.innerHTML='<span class="num">'+(i+1)+'</span>'+p.name.split(' · ')[1]+dots(p);b.onclick=function(){show(i+1)};sw.appendChild(b);
  st.insertAdjacentHTML('beforeend','<div class="stage" id="s'+(i+1)+'">'+bar(true)+
   '<div class="hint">Coba: ganti peran (termasuk Siswa dan Orang tua), pindah Terang/Gelap, dan tekan <kbd>Ctrl</kbd> + <kbd>K</kbd>. Tombol "Bandingkan 4" di bar atas menampilkan keempat palet berdampingan.</div>'+
   '<div class="view active" data-dev="d"><div class="fit" data-w="1200" data-h="780"><div id="v-'+p.id+'-d"></div></div></div><div class="view" data-dev="m"><div class="fit" data-w="372" data-h="756"><div id="v-'+p.id+'-m"></div></div></div>'+
   '<div class="direction-note"><b>Palet '+p.name+'.</b> '+p.mood+'<div class="chips">'+p.cols.map(function(c){return '<span class="c"><i style="background:'+c[1]+'"></i>'+c[0]+' '+c[1]+'</span>'}).join('')+'</div></div></div>');
  var d=document.getElementById('v-'+p.id+'-d'),m=document.getElementById('v-'+p.id+'-m');d.setAttribute('data-pal',p.id);m.setAttribute('data-pal',p.id);
  inst[p.id]={d:EduApp.create(d,{theme:'c',cls:'th-c5',mob:false}),m:EduApp.create(m,{theme:'c',cls:'th-c5',mob:true})};
  d.setAttribute('data-pal',p.id);m.setAttribute('data-pal',p.id);
});
/* bandingkan 4 */
var cb=document.createElement('button');cb.innerHTML='<span class="num">5</span>Bandingkan 4';cb.onclick=function(){show(5)};sw.appendChild(cb);
st.insertAdjacentHTML('beforeend','<div class="stage" id="s5">'+bar(false)+'<div class="hint">Keempat palet pada layar yang sama. Ganti peran atau mode untuk membandingkan di dasbor siswa, orang tua, dan lainnya.</div><div class="view active"><div class="cmp">'+PALS.map(function(p){return '<div class="cell"><h3>'+p.name+dots(p).replace('class="sw"','class="sw"')+'</h3><div class="fit" data-w="1200" data-h="780"><div id="v-cmp-'+p.id+'"></div></div></div>'}).join('')+'</div></div></div>');
PALS.forEach(function(p){var e=document.getElementById('v-cmp-'+p.id);e.setAttribute('data-pal',p.id);cmp[p.id]=EduApp.create(e,{theme:'c',cls:'th-c5',mob:false});e.setAttribute('data-pal',p.id)});
var rs=document.createElement('span');rs.className='sp';sw.appendChild(rs);
var rb=document.createElement('button');rb.className='reset';rb.textContent='Reset data demo';rb.onclick=function(){EDUDATA.reset();all(function(a){a.showLogin()});document.querySelectorAll('.stage .bar2 [data-role]').forEach(function(x){x.classList.toggle('active',x.dataset.role==='login')})};sw.appendChild(rb);
function all(fn){PALS.forEach(function(p){fn(inst[p.id].d);fn(inst[p.id].m);fn(cmp[p.id])})}
function stageInst(sid){return sid===5?PALS.map(function(p){return cmp[p.id]}):[inst[PALS[sid-1].id].d,inst[PALS[sid-1].id].m]}
st.addEventListener('click',function(e){
  var b=e.target.closest('.bar2 button');if(!b)return;var s=b.closest('.stage'),sid=+s.id.slice(1),list=stageInst(sid);
  if(b.dataset.role){s.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('active',x===b)});list.forEach(function(a){if(b.dataset.role==='login')a.showLogin();else a.loginAs(b.dataset.role)})}
  if(b.dataset.mode){s.querySelectorAll('[data-mode]').forEach(function(x){x.classList.toggle('active',x===b)});list.forEach(function(a){a.setMode(b.dataset.mode)})}
  if(b.dataset.dev){s.querySelectorAll('[data-dev]').forEach(function(x){if(x.tagName==='BUTTON')x.classList.toggle('active',x===b);else x.classList.toggle('active',x.dataset.dev===b.dataset.dev)});fit()}
  if(b.dataset.motion){document.querySelectorAll('[data-motion]').forEach(function(x){x.classList.toggle('active',x.dataset.motion===b.dataset.motion)});if(b.dataset.motion==='off')document.documentElement.setAttribute('data-motion','off');else document.documentElement.removeAttribute('data-motion')}
});
function show(n){
  document.querySelectorAll('.stage').forEach(function(s){s.classList.remove('active')});
  document.getElementById('s'+n).classList.add('active');
  document.querySelectorAll('#switcher button:not(.reset)').forEach(function(b,i){b.classList.toggle('active',i===n-1)});
  try{history.replaceState(null,'','#'+n)}catch(e){}
  fit();
}
function fit(){
  var s=document.querySelector('.stage.active');if(!s)return;
  s.querySelectorAll('.view.active .fit').forEach(function(f){
    var w=+f.dataset.w,h=+f.dataset.h,mobile=w<500,par=f.parentElement,cs=getComputedStyle(par),pw=par.clientWidth-(parseFloat(cs.paddingLeft)||0)*2,availH=innerHeight-190;
    var k=mobile?Math.min(availH/h,1.1):Math.min(pw/w,1.3);
    f.style.width=(w*k)+'px';f.style.height=(h*k)+'px';f.firstElementChild.style.transform='scale('+k+')';
  });
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
var n=parseInt((location.hash||'#1').slice(1),10);show(n>=1&&n<=5?n:1);
</script>
</body>
</html>
