<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 — EduCentre: 5 Arah (eksplorasi)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Nunito:wght@500;700;800&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e9e9ec;color:#111;}
  #switcher{position:sticky;top:0;z-index:100;display:flex;gap:0;background:#111;padding:10px 12px;overflow-x:auto;align-items:center;}
  #switcher a.back{color:#888;font-size:12px;margin-right:14px;text-decoration:none;white-space:nowrap;}
  #switcher button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:8px;margin-right:8px;background:#2a2a2a;color:#ccc;cursor:pointer;white-space:nowrap;}
  #switcher button.active{background:#fff;color:#111;}
  #switcher .num{opacity:.55;margin-right:6px;font-weight:400;}
  .stage{display:none;}
  .stage.active{display:block;}
  .views{display:flex;gap:8px;padding:12px 16px 0;background:#e9e9ec;}
  .views button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border:1px solid #c9c9ce;border-radius:20px;background:#fff;color:#444;cursor:pointer;}
  .views button.active{background:#111;color:#fff;border-color:#111;}
  .view{display:none;padding:14px 16px 0;}
  .view.active{display:block;}
  .view.m{display:none;justify-content:center;}
  .view.m.active{display:flex;}
  .fit{position:relative;margin:0 auto;}
  .fit>.mk{position:absolute;left:0;top:0;transform-origin:0 0;}
  .direction-note{font-size:12.5px;line-height:1.55;margin:16px;padding:14px 16px;border-radius:10px;background:#fff;border:1px dashed #b9b9c0;color:#333;}
  .direction-note b{color:#111}
  .direction-note .sw{display:inline-flex;gap:4px;vertical-align:middle;margin-left:8px}
  .direction-note .sw i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);display:block}
  .mk *{box-sizing:border-box}
/* ========= mockup umum ========= */
.mk *{box-sizing:border-box}
.mk{line-height:1.35}
.dk{width:1000px;height:620px;overflow:hidden;position:relative;font-size:13px}
.ph{width:270px;height:560px;border:8px solid #15151a;border-radius:36px;overflow:hidden;position:relative;font-size:13px}
.ph .sb{display:flex;justify-content:space-between;padding:7px 18px 2px;font-size:11px;font-weight:700}
.credit{font-size:12px;opacity:.75}

/* ===== D1 Buku Induk ===== */
.d1{--paper:#fbf6e6;--ink:#1d3a6b;--red:#b3261e;--green:#2a6b3a;--line:#c9d6ea;font-family:"Newsreader",serif;color:var(--ink)}
.d1 .dk{background:#d9cba8}
.d1 .page{position:absolute;left:28px;top:22px;right:70px;bottom:22px;background:var(--paper);box-shadow:0 2px 0 #b9a77a,0 10px 24px rgba(60,40,10,.25);padding:20px 30px 18px 64px;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 54px}
.d1 .page::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:#e29a94}
.d1 .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:8px;background:var(--paper);margin-left:-18px;padding-left:18px}
.d1 .hd h5{margin:0;font:600 30px/1 "Newsreader";letter-spacing:.02em}
.d1 .hd small{font:italic 14px "Newsreader"}
.d1 .tally{display:flex;gap:26px;margin:4px 0 6px;font:600 17px "Newsreader";background:var(--paper);padding:2px 0;margin-left:-18px;padding-left:18px}
.d1 .tally b{font:600 28px/1 "Caveat";color:var(--red);margin-right:4px}
.d1 table{border-collapse:collapse;width:100%;font-size:15px}
.d1 th{font:600 12px "Newsreader";text-transform:uppercase;letter-spacing:.08em;text-align:left;border-bottom:2px solid var(--ink);padding:4px 8px;background:var(--paper)}
.d1 td{height:32px;padding:0 8px;vertical-align:middle;border-bottom:1px solid transparent}
.d1 td.no{width:32px}
.d1 .hand{font:600 20px/1 "Caveat";color:#25458a}
.d1 .stamp{display:inline-block;font:700 12px "IBM Plex Mono";letter-spacing:.1em;border:2px solid;border-radius:4px;padding:1px 7px;transform:rotate(-6deg)}
.d1 .stamp.ok{color:var(--green);border-color:var(--green)}.d1 .stamp.no{color:var(--red);border-color:var(--red)}
.d1 .sticky{position:absolute;right:26px;bottom:26px;width:210px;background:#fff1a8;padding:12px 14px;transform:rotate(2deg);box-shadow:0 4px 10px rgba(0,0,0,.2);font:600 20px/1.15 "Caveat";color:#4a3a00}
.d1 .tabs{position:absolute;right:0;top:46px;display:flex;flex-direction:column;gap:6px}
.d1 .tabs span{width:76px;padding:9px 6px 9px 12px;font:600 13px "Newsreader";background:#c9b88b;color:#3d2f10;border-radius:0 10px 10px 0;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.d1 .tabs span.on{background:var(--paper);width:82px;font-weight:700;color:var(--ink)}
.d1 .dk .credit{position:absolute;left:92px;bottom:26px;background:var(--paper);padding:0 6px}
.d1 .ph{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-position:0 60px}
.d1 .ph .sb{background:var(--paper)}
.d1 .ph h5{margin:0;font:600 24px/1.1 "Newsreader"}
.d1 .ph .top{padding:6px 18px 8px 44px;border-bottom:3px double var(--ink);background:var(--paper);position:relative}
.d1 .ph .top small{font:italic 14px "Newsreader"}
.d1 .ph::after{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:#e29a94;z-index:0}
.d1 .ph .rows{padding:8px 14px 0 44px;position:relative;z-index:1}
.d1 .ph .r{height:28px;display:flex;align-items:center;gap:8px;font-size:16px}
.d1 .ph .r i{margin-left:auto;font:600 20px "Caveat";font-style:normal;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;color:#25458a}
.d1 .ph .r i.t{color:#a86b00;border-color:#a86b00}.d1 .ph .r i.a{color:var(--red);border-color:var(--red)}.d1 .ph .r i.iz{color:#666;border-color:#666}
.d1 .ph .sign{position:absolute;left:44px;right:16px;bottom:14px;text-align:center;background:var(--ink);color:#fff;font:600 16px "Newsreader";padding:10px;border-radius:3px;z-index:2}
.d1 .ph .rp{padding:6px 14px 0 44px;position:relative;z-index:1}
.d1 .ph .rp table{font-size:15px}
.d1 .ph .rp td{height:28px;padding:0 4px}

/* ===== D2 Linimasa ===== */
.d2{--bg:#eef3f1;--ink:#0d2d33;--mut:#53717a;--teal:#0f4c58;--amber:#f2a33a;--line:#cfdcd9;font-family:"Plus Jakarta Sans",sans-serif;color:var(--ink)}
.d2 .dk{background:var(--bg)}
.d2 .topbar{height:56px;background:var(--teal);color:#e9f5f3;display:flex;align-items:center;gap:20px;padding:0 20px}
.d2 .topbar b{font:700 18px "Space Grotesk"}
.d2 .topbar .st{display:flex;gap:18px;margin-left:auto;font-size:13px}.d2 .topbar .st span b{font:700 16px "Space Grotesk";color:var(--amber);margin-right:4px}
.d2 .days{display:flex;gap:6px;padding:12px 20px 8px}
.d2 .days span{padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--mut)}
.d2 .days span.on{background:var(--amber);color:#2c1b00;border-color:var(--amber)}
.d2 .body{display:grid;grid-template-columns:1fr 262px;gap:16px;padding:0 20px;height:476px}
.d2 .grid{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.d2 .lanes{display:grid;grid-template-columns:56px repeat(3,1fr);height:30px;border-bottom:1px solid var(--line);background:#f7faf9;font:600 12px "Space Grotesk";color:var(--mut)}
.d2 .lanes span{padding:8px 10px}
.d2 .tl{position:absolute;left:0;right:0;top:30px;bottom:0;background-image:repeating-linear-gradient(transparent 0 36px,#e5eeec 36px 37px)}
.d2 .hr{position:absolute;left:8px;font:500 12px "DM Mono";color:var(--mut)}
.d2 .ev{position:absolute;border-radius:10px;padding:7px 10px;font-weight:700;line-height:1.25;color:#fff;font-size:13px;overflow:hidden}
.d2 .ev small{display:block;font-weight:500;opacity:.9;font-size:12px}
.d2 .ev.done{background:#6f8f95}.d2 .ev.now{background:var(--teal);box-shadow:0 0 0 3px var(--amber)}.d2 .ev.next{background:#2c7a88}
.d2 .now-line{position:absolute;left:0;right:0;height:2px;background:var(--amber);z-index:2}
.d2 .now-line::before{content:"15.42";position:absolute;left:4px;top:-9px;background:var(--amber);color:#2c1b00;font:700 11px "DM Mono";padding:1px 5px;border-radius:4px}
.d2 .side h4{margin:0 0 8px;font:700 14px "Space Grotesk"}
.d2 .it{background:#fff;border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.d2 .it b{display:block}.d2 .it small{color:var(--mut)}
.d2 .it .go{display:inline-block;margin-top:6px;background:var(--teal);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:4px 12px}
.d2 .dk .credit{position:absolute;right:20px;bottom:6px}
.d2 .ph{background:var(--bg)}
.d2 .ph .hd{background:var(--teal);color:#e9f5f3;padding:10px 16px 14px}
.d2 .ph .hd h5{margin:0;font:700 20px "Space Grotesk"}.d2 .ph .hd small{opacity:.8}
.d2 .ph .tlm{padding:12px 14px 0 18px;position:relative}
.d2 .ph .tlm::before{content:"";position:absolute;left:41px;top:20px;bottom:60px;width:2px;background:var(--line)}
.d2 .ph .e{display:flex;gap:12px;margin-bottom:12px;position:relative}
.d2 .ph .e time{font:500 12px "DM Mono";width:42px;color:var(--mut);padding-top:2px}
.d2 .ph .e .dot{position:absolute;left:44px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #6f8f95;z-index:1}
.d2 .ph .e.now .dot{border-color:var(--amber);background:var(--amber)}
.d2 .ph .e .c{margin-left:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;flex:1}
.d2 .ph .e.now .c{border:2px solid var(--teal)}
.d2 .ph .e .c b{display:block}.d2 .ph .e .c small{color:var(--mut)}
.d2 .ph .btn{display:block;margin-top:8px;background:var(--teal);color:#fff;text-align:center;font-weight:700;border-radius:10px;padding:9px}
.d2 .ph .chipx{display:inline-block;background:#fdeacb;color:#6a4400;font-weight:700;font-size:12px;border-radius:99px;padding:2px 9px}

/* ===== D3 Obrolan ===== */
.d3{--ink:#13251d;--mut:#5a6e65;--green:#0b6b4f;--bub:#e3f1e9;--bg:#f4f1ea;--line:#dcd8cc;font-family:"Nunito",sans-serif;color:var(--ink)}
.d3 .dk{display:grid;grid-template-columns:230px 1fr 230px;background:var(--bg)}
.d3 .l{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.d3 .l .brand{font:800 18px "Nunito";padding:0 8px 10px;display:flex;gap:8px;align-items:center}.d3 .l .brand b{width:24px;height:24px;border-radius:8px;background:var(--green);display:block}
.d3 .l .s{font:800 11px "Nunito";text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:8px 8px 4px}
.d3 .room{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:10px;font-weight:700}
.d3 .room.on{background:var(--bub);color:var(--green)}
.d3 .room em{font-style:normal;background:var(--green);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.d3 .c{display:flex;flex-direction:column;background:#efe9db;background-image:radial-gradient(#e2dac6 1px,transparent 1px);background-size:14px 14px}
.d3 .c .h{background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;font-weight:800;display:flex;justify-content:space-between}
.d3 .c .h small{font-weight:600;color:var(--mut)}
.d3 .feed{flex:1;padding:14px 22px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.d3 .day{align-self:center;background:#fff;border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mut);font-weight:700}
.d3 .m{max-width:70%;background:#fff;border-radius:4px 16px 16px 16px;padding:8px 12px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.d3 .m .who{font-weight:800;font-size:12px;color:var(--green)}.d3 .m time{float:right;margin-left:12px;font-size:11px;color:var(--mut)}
.d3 .m.me{align-self:flex-end;background:var(--bub);border-radius:16px 4px 16px 16px}
.d3 .card{align-self:flex-start;width:78%;background:#fff;border-radius:14px;border-left:6px solid var(--green);padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.d3 .card.warn{border-color:#d98a00}.d3 .card b{display:block}
.d3 .card .acts{display:flex;gap:8px;margin-top:8px}
.d3 .card .acts span{border:1.5px solid var(--green);color:var(--green);font-weight:800;border-radius:99px;padding:3px 13px;font-size:12px}
.d3 .card .acts span.p{background:var(--green);color:#fff}
.d3 .comp{background:#fff;border-top:1px solid var(--line);padding:10px 14px}
.d3 .comp .q{display:flex;gap:8px;margin-bottom:8px}.d3 .comp .q span{background:var(--bub);color:var(--green);font-weight:800;font-size:12px;border-radius:99px;padding:3px 12px}
.d3 .comp .in{background:#f4f1ea;border-radius:99px;padding:9px 16px;color:var(--mut)}
.d3 .r{background:#fff;border-left:1px solid var(--line);padding:16px;font-size:13px}
.d3 .r h4{margin:0 0 8px;font:800 14px "Nunito"}
.d3 .r .kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.d3 .r .kv span{color:var(--mut)}
.d3 .dk .credit{position:absolute;left:12px;bottom:10px}
.d3 .ph{background:#efe9db;background-image:radial-gradient(#e2dac6 1px,transparent 1px);background-size:14px 14px;display:flex;flex-direction:column}
.d3 .ph .hd{background:var(--green);color:#fff;padding:8px 14px 10px;display:flex;gap:10px;align-items:center}
.d3 .ph .hd b{display:block;font-weight:800;font-size:16px}.d3 .ph .hd small{opacity:.85}
.d3 .ph .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800}
.d3 .ph .f{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.d3 .ph .m{max-width:88%;font-size:13px}.d3 .ph .card{width:92%;font-size:13px}
.d3 .ph .stu{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.d3 .ph .stu span{background:var(--bub);color:var(--green);font-weight:800;font-size:12px;border-radius:99px;padding:2px 9px}
.d3 .ph .stu span.t{background:#fdeacb;color:#6a4400}.d3 .ph .stu span.a{background:#fbd9d4;color:#7a1d12}
.d3 .ph .in{background:#fff;margin:0;padding:9px 12px;display:flex;gap:6px;border-top:1px solid var(--line)}.d3 .ph .in span{background:var(--bub);color:var(--green);font-weight:800;font-size:12px;border-radius:99px;padding:3px 10px}

/* ===== D4 Kartu Siswa ===== */
.d4{--ink:#1e2433;--mut:#667089;--bg:#f6f4fb;font-family:"Outfit",sans-serif;color:var(--ink)}
.d4 .dk{background:var(--bg);display:grid;grid-template-columns:1fr 290px}
.d4 .main{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.d4 .top{display:flex;gap:10px;align-items:center}
.d4 .top b{font:700 20px "Outfit"}.d4 .top .ch{margin-left:auto;display:flex;gap:6px}
.d4 .ch span{padding:5px 13px;border-radius:99px;background:#fff;border:1px solid #e3def0;font-weight:500;font-size:13px}
.d4 .ch span.on{background:#1e2433;color:#fff;border-color:#1e2433}.d4 .ch span.att{background:#ffe3e0;border-color:#ffc9c3;color:#8a2b20}
.d4 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.d4 .s{background:#fff;border-radius:20px;padding:12px 14px;border:2px solid transparent;box-shadow:0 2px 0 rgba(30,36,51,.06)}
.d4 .s.sel{border-color:#6c5ce7}.d4 .s.warn{background:#fff4f2}.d4 .s.good{background:#f2fbf6}
.d4 .s .t{display:flex;gap:10px;align-items:center}
.d4 .av{width:38px;height:38px;border-radius:14px;background:var(--c,#dcd5ff);display:grid;place-items:center;font-weight:700}
.d4 .s b{display:block;font-weight:600}.d4 .s small{color:var(--mut);font-size:12px}
.d4 .ring{margin-left:auto;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--rc,#16a870) calc(var(--p)*1%),#ece9f5 0);display:grid;place-items:center;position:relative}
.d4 .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}.d4 .s.warn .ring::after{background:#fff4f2}.d4 .s.good .ring::after{background:#f2fbf6}
.d4 .ring i{position:relative;z-index:1;font:600 11px "Outfit";font-style:normal}
.d4 .bars{display:flex;gap:4px;align-items:flex-end;height:24px;margin:10px 0 8px}.d4 .bars i{flex:1;background:#b9aef7;border-radius:4px 4px 0 0}
.d4 .tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
.d4 .tag.ok{background:#d5f5e6;color:#0a6a43}.d4 .tag.w{background:#fff0b8;color:#6b4a00}.d4 .tag.b{background:#ffd4d9;color:#8a1630}
.d4 .dr{background:#fff;border-left:1px solid #e9e4f5;padding:18px 18px;display:flex;flex-direction:column;gap:10px}
.d4 .dr .big{width:64px;height:64px;border-radius:22px;background:#ffd4d9;display:grid;place-items:center;font:700 22px "Outfit"}
.d4 .dr h4{margin:0;font:700 20px "Outfit"}.d4 .dr small{color:var(--mut)}
.d4 .dr .row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #efeaf8}
.d4 .dr .cta{margin-top:auto;background:#6c5ce7;color:#fff;font-weight:600;border-radius:14px;padding:10px;text-align:center}
.d4 .dk .credit{position:absolute;left:18px;bottom:8px}
.d4 .ph{background:var(--bg)}
.d4 .ph .hd{padding:10px 16px 6px}.d4 .ph .hd h5{margin:0;font:700 22px "Outfit"}.d4 .ph .hd small{color:var(--mut)}
.d4 .ph .g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:6px 12px}
.d4 .ph .tile{border-radius:20px;padding:12px;text-align:center;font-weight:600;background:#d5f5e6}
.d4 .ph .tile .av{margin:0 auto 6px;background:#fff;width:44px;height:44px}.d4 .ph .tile small{display:block;font-weight:500;color:#37574a}
.d4 .ph .tile.t{background:#fff0b8}.d4 .ph .tile.a{background:#ffd4d9}.d4 .ph .tile.i{background:#e6e1ff}
.d4 .ph .save{position:absolute;left:12px;right:12px;bottom:12px;background:#6c5ce7;color:#fff;text-align:center;font-weight:600;border-radius:18px;padding:12px}
.d4 .ph .hero{margin:6px 12px;background:#6c5ce7;color:#fff;border-radius:26px;padding:14px}
.d4 .ph .hero .t{display:flex;gap:10px;align-items:center}.d4 .ph .hero .av{background:#fff;color:#6c5ce7}
.d4 .ph .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center;font-size:12px}
.d4 .ph .rings .ring{margin:0 auto 4px;width:54px;height:54px;background:conic-gradient(#ffd24a calc(var(--p)*1%),rgba(255,255,255,.25) 0)}.d4 .ph .rings .ring::after{background:#6c5ce7}
.d4 .ph .need{margin:8px 12px;background:#fff;border-radius:18px;padding:10px 14px}.d4 .ph .need b{display:block;margin-bottom:4px}

/* ===== D5 Meja Kasir ===== */
.d5{--ink:#141414;--paper:#fcfbf6;--hl:#ffe14d;--mut:#666;font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.d5 .dk{background:#dedbd0;padding:16px;display:grid;grid-template-columns:1fr 330px;gap:16px;grid-template-rows:96px 1fr}
.d5 .led{grid-column:1/-1;background:#15130f;border-radius:10px;display:flex;gap:34px;align-items:center;padding:0 26px;color:#ffb347;box-shadow:inset 0 0 0 3px #2a2620}
.d5 .led div small{display:block;color:#a07a3e;font-size:12px;letter-spacing:.14em}
